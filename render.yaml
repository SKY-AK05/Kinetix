services:
  - type: web
    name: kinetix-backend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: FILE_RETENTION_SECONDS
        value: "900"
      - key: MAX_CONCURRENT
        value: "2"
      - key: PORT
        value: "3000"
